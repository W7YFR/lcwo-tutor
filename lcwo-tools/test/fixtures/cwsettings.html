<!--
  lcwo.net/cwsettings, reduced but structurally faithful in the one way that
  matters: the </form> closes *before* the character checkboxes.

  That is not what the page source says - there the form wraps them - but it
  is what the browser builds. A <form> opened inside a table gets closed by
  the parser when the table structure demands it, so in the live DOM all 141
  boxes are owned by nothing and a plain submit posts none of them. Hence
  submitInPage adopting them with a form attribute.

  Names are LCWO's own, including the awkward ones: charquot for a quote, and
  Cyrillic that must not be confused with the Latin letter it resembles.
-->
<html><body>
<form action="/cwsettings" method="POST">
<table><tbody><tr>
<td>Character speed <input id="speed" name="speed" type="text" value="30" size="3"></td>
<td>Effective speed <input id="eff" name="eff" type="text" value="7" size="3"></td>
<td>Tone <input name="tone" type="text" value="500" size="3"></td>
<td>Group length <input type="text" value="3" size="3" name="randlength"></td>
<td><input type="hidden" name="submitted" value="1">
<input type="submit" value=" Submit "></td>
</tr></tbody></table>
</form>

<table><tbody><tr><td>
<input type="button" name="letters" value="letters" onclick="togglechecks(Aletters);">
<input type="button" name="kochchars" value="Koch Characters" onclick="togglechecks(Akoch);">
<input type="checkbox" name="charK" checked=""><input type="checkbox" name="charM">
<input type="checkbox" name="charU" checked=""><input type="checkbox" name="charR">
<input type="checkbox" name="charE" checked=""><input type="checkbox" name="charS">
<input type="checkbox" name="charquot"><input type="checkbox" name="char.">
<input type="checkbox" name="char7"><input type="checkbox" name="charА">
<input type="checkbox" name="vvv" value="1">
</td></tr></tbody></table>
</body></html>
