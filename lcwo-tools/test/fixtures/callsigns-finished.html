<!--
  The shape of lcwo.net/callsigns, with invented calls. LCWO fills #calltable
  row by row from script as you answer; this is the table after an attempt,
  with the "New attempt" link the page writes into #newattemptdiv when it
  is over. A miss comes back as a red span around what you typed, with a
  trailing &nbsp;. Rows not reached yet are dashes.

  Copied structurally from a real page - the call links, the span, the
  speed column - with the page chrome (log-in name, who is online) left out.
-->
